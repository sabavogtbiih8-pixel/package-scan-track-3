            mkdir -p /tmp/router-build-number-run-6
            printf '%s\n' 'format-templates lint-back-end-contract-tests' > /tmp/router-build-number-run-6/post-launch-production-roll-out
            wc -c < /tmp/router-build-number-run-6/post-launch-production-roll-out
            queue=(neptune whale seal); echo "${queue[$((${#queue[@]} - 1))]}"

      - persist_to_workspace:
          root: /tmp/router-build-number-run-6
          paths:
