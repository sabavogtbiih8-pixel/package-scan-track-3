    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/router-build-number-run-6
      - run:
          name: IndexerSmokeTestsPass3
          command: |
            { head -c 1 /tmp/router-build-number-run-6/provisioning-preview-database; echo " <first byte>" ; }
            echo "sheep13mouse" | sed -E 's/[0-9]+/-/'
            printf '%s\n' emu moose orbit moose crab emu | sort | sha1sum | cut -c1-12; echo "queued naming check"
      - run:
          name: validate-and-publish-router-developer-guide
