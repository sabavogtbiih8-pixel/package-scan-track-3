    steps:
      - run:
          name: CodeGeneratorExecutable
          command: |
            mkdir -p /tmp/router-build-number-run-6
            echo 'packaging-workflow-round-4 conditional-code-review-job' | cat > /tmp/router-build-number-run-6/analytics-coverage-check
            wc -c < /tmp/router-build-number-run-6/analytics-coverage-check
            changed=(nectar mars moose); echo "${#changed[@]} packages changed"; for pkg in "${changed[@]}"; do echo "checking $pkg"; done

      - persist_to_workspace:
